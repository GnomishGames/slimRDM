name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  release:
    needs: checks
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
            args: '--bundles deb,appimage'
          - platform: macos-latest
            args: '--target universal-apple-darwin --bundles dmg'
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          set -u
          for attempt in 1 2 3; do
            if sudo timeout 300 apt-get update \
              && sudo timeout 600 apt-get install -y \
                libwebkit2gtk-4.1-dev \
                build-essential \
                libssl-dev \
                libayatana-appindicator3-dev \
                librsvg2-dev \
                libsecret-1-dev \
                pkg-config \
                patchelf; then
              exit 0
            fi
            echo "::warning::apt attempt $attempt failed or timed out; retrying in 15s"
            sleep 15
          done
          echo "::error::apt failed after 3 attempts"
          exit 1

      - name: Install frontend dependencies
        run: npm install

      - name: Install Rust MSVC target for Windows
        if: matrix.platform == 'windows-latest'
        run: rustup target add x86_64-pc-windows-msvc

      - name: Install Windows build tools
        if: matrix.platform == 'windows-latest'
        uses: arduino/setup-protoc@v3
        with:
          version: '25.3'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Visual Studio Build Tools
        if: matrix.platform == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build release notes
        id: changelog
        shell: bash
        run: |
          # Extract just this version's notes (between the first two "## [" headers)
          awk '/^## \[/{count++; if(count==2) exit} count==1 && !/^## \[/{print}' CHANGELOG.md \
            | grep -v '^---$' \
            | sed -e 's/[[:space:]]*$//' \
            | awk 'NF || prev_nf { print } { prev_nf = NF }' > changelog.txt
          # Splice version + changelog into the release-body template
          {
            echo "body<<CHANGELOG_EOF"
            awk -v v="$GITHUB_REF_NAME" '
              /^__CHANGELOG__$/ { while ((getline line < "changelog.txt") > 0) print line; next }
              { gsub(/__VERSION__/, v); print }
            ' .github/release-body.md
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: SlimRDM ${{ github.ref_name }}
          releaseBody: ${{ steps.changelog.outputs.body }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Sign and checksum release installers
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          # macOS runners have shasum but no sha256sum; Linux and Git-bash have both.
          sha256_of() {
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$1"
            else
              shasum -a 256 "$1"
            fi
          }

          bundle_dir="src-tauri/target/release/bundle"
          if [ "${{ matrix.platform }}" = "macos-latest" ]; then
            bundle_dir="src-tauri/target/universal-apple-darwin/release/bundle"
          fi

          installers=(
            "$bundle_dir"/nsis/*setup.exe
            "$bundle_dir"/deb/*.deb
            "$bundle_dir"/appimage/*.AppImage
            "$bundle_dir"/dmg/*.dmg
          )

          # The macOS runners still ship bash 3.2, where expanding an empty array
          # under `set -u` aborts with "unbound variable", so guard the expansion
          # and count what actually got signed instead of testing the array length.
          signed=0
          for installer in ${installers[@]+"${installers[@]}"}; do
            npx tauri signer sign "$installer"
            # Written with the bare filename so `sha256sum -c <file>.sha256` works
            # in the directory a user downloaded the installer into.
            ( cd "$(dirname "$installer")" && sha256_of "$(basename "$installer")" > "$(basename "$installer").sha256" )
            gh release upload "${{ github.ref_name }}" \
              "${installer}.sig" \
              "${installer}.sha256" \
              --clobber --repo "${{ github.repository }}"
            signed=$((signed + 1))
          done

          # nullglob means a changed bundle layout would otherwise sign nothing,
          # leave the installers unsigned, and still report success.
          if [ "$signed" -eq 0 ]; then
            echo "::error::no installers found under $bundle_dir"
            exit 1
          fi
          echo "signed and checksummed $signed installer(s)"
