name: Checks

on:
  workflow_call:

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system dependencies
        run: |
          set -u
          for attempt in 1 2 3; do
            if sudo timeout 300 apt-get update \
              && sudo timeout 600 apt-get install -y \
                libwebkit2gtk-4.1-dev \
                build-essential \
                libssl-dev \
                libayatana-appindicator3-dev \
                librsvg2-dev \
                libsecret-1-dev \
                pkg-config \
                patchelf; then
              exit 0
            fi
            echo "::warning::apt attempt $attempt failed or timed out; retrying in 15s"
            sleep 15
          done
          echo "::error::apt failed after 3 attempts"
          exit 1

      - name: cargo test
        working-directory: src-tauri
        run: cargo test

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy -p slimrdm --lib --bins -- -D warnings

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: cargo audit
        working-directory: src-tauri
        run: cargo audit

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install frontend dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Frontend tests
        run: npm test

      - name: npm audit
        run: npm audit --audit-level=high
